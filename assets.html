<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>資産記録 | みゃー家 HOME</title>
    <link rel="icon" type="image/png" href="icon.PNG" />
    <link rel="apple-touch-icon" href="icon.PNG" />
    <meta name="apple-mobile-web-app-title" content="みゃーの家" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">HOUSE APP</p>
        <h1>💰 資産記録</h1>
        <p>毎月の資産を、ゆるく振り返ろう。</p>
        <nav class="app-nav" aria-label="メインメニュー">
          <a href="index.html">やることリスト</a>
          <a href="media.html">読みたい本</a>
          <a href="movies.html">見たい映画</a>
          <a class="active" href="assets.html" aria-current="page">資産記録</a>
        </nav>
      </header>

      <section class="asset-card" aria-labelledby="asset-title">
        <div class="section-heading">
          <div>
            <h2 id="asset-title">📈 毎月の資産</h2>
            <p>日付と合計金額を記録すると、前回からの増減を自動で計算します。</p>
          </div>
        </div>

        <form id="asset-form">
          <div class="asset-inputs">
            <div>
              <label for="asset-date">日付</label>
              <input id="asset-date" type="date" required />
            </div>
            <div>
              <label for="asset-amount">金額</label>
              <input id="asset-amount" type="text" inputmode="numeric" pattern="[0-9,]*" placeholder="例：1,500,000" required />
            </div>
          </div>
          <button type="submit">記録する</button>
        </form>

        <section class="asset-chart-section" aria-labelledby="asset-chart-title">
          <h3 id="asset-chart-title">資産の推移</h3>
          <div id="asset-chart" class="asset-chart" role="img" aria-label="資産の推移グラフ"></div>
          <p id="asset-chart-empty" class="empty-message">記録を追加するとグラフが表示されます。</p>
        </section>

        <div class="asset-table-wrap" tabindex="0">
          <table>
            <thead>
              <tr>
                <th scope="col">日付</th>
                <th scope="col">金額</th>
                <th scope="col">前回からの増減</th>
                <th scope="col"><span class="sr-only">操作</span></th>
              </tr>
            </thead>
            <tbody id="asset-list"></tbody>
          </table>
          <p id="asset-empty" class="empty-message">まだ記録がありません。</p>
        </div>
      </section>
    </main>

    <script src="assets.js"></script>
  </body>
</html>
